# Example only: on first startup the plugin generates entries for EVERY registered
# Velocity backend, all disabled. Edit plugins/minimum-player-gate/config.properties.
# Names are exact and case-sensitive. Unknown keys/invalid values reject reload.
# Read forwarding mode and secret path from the proxy's velocity.toml.
# For a custom proxy config path, change limbo.velocity-config.
# These three settings require a restart; per-server settings can be reloaded.
limbo.forwarding-mode=AUTO
limbo.velocity-config=velocity.toml
limbo.forwarding-secret-file=
transfer-timeout-seconds=30
backend-retry-seconds=10

server.lobby.enabled=false
server.lobby.minimum-players=1
server.lobby.close-below=1
server.lobby.close-delay-seconds=0
server.lobby.return-to-waiting=false

server.forge.enabled=true
server.forge.minimum-players=4
# Close only when population is STRICTLY less than 2 for 30 continuous seconds.
server.forge.close-below=2
server.forge.close-delay-seconds=30
server.forge.return-to-waiting=true

server.minigames.enabled=true
server.minigames.minimum-players=6
server.minigames.close-below=3
server.minigames.close-delay-seconds=15
# Existing backend players stay; new arrivals wait until population reaches 6.
server.minigames.return-to-waiting=false
